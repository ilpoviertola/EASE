[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[tool.isort]
line_length = 100

[project]
name = "ease"
version = "0.0.1"
authors = [{ name = "Ilpo Viertola", email = "ilpo.viertola@tuni.fi" }]
description = "Encoder-only Audio-Visual Segmentation."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'torch >= 2.7.1',
  'transformers >= 4.53.1, <= 5.2.0',
  'cython',
  'lightning[pytorch-extra]',
  'scipy >= 1.16',
  'einops',
  'librosa',
  'torchlibrosa',
  'gitignore_parser',
  'timm',
  'wandb',
]

[tool.hatch.build.targets.wheel]
packages = ["ease"]
